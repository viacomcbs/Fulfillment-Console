[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    login: Service account login smoke (no Okta push)
    home: Personal login home page smoke (session saved)
    tablerefresh: BSD-29582 table header refresh tests
    dsid: BSD-29870 DSID column validation tests
    orders: Orders tab
    lineitems: Line Items tab
addopts = -v --tb=short

# Orders-view left-filter regression on PROD Synergy (Core 8 filters — Error Message excluded).
# Sends one HTML email + Slack summary when the suite finishes.
#
# Prerequisites:
#   - Self-hosted runner labels: self-hosted, linux, synergy
#   - Repository secrets: SLACK_WEBHOOK_URL (and Maven/Nexus access on runner — see docs/github-actions.md)

name: Left Filter Regression — Orders Core 8 PROD

on:
  schedule:
    # Weekdays 11:00 UTC (~6:30 AM ET). Adjust after lead confirms preferred time.
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      email:
        description: Report email recipient
        required: true
        default: Akilandeswari.Sundararajan@paramount.com
      slack_channel:
        description: Slack channel (e.g. #fulfillment-console-qa)
        required: true
        default: '#fulfillment-console-qa'

concurrency:
  group: lf-regression-orders-core8-prod
  cancel-in-progress: false

jobs:
  run-orders-core8-prod:
    name: Orders Core 8 left filters (PROD)
    runs-on: [self-hosted, linux, synergy]
    timeout-minutes: 360
    env:
      SUITE: src/test/resources/regression/left-filters/orders-view/LF_O_Core8_LeftFilters_ProdServerSuite.xml
      TEST_ENV: PROD
      REPORT_EMAIL: ${{ github.event.inputs.email || 'Akilandeswari.Sundararajan@paramount.com' }}
      SLACK_CHANNEL: ${{ github.event.inputs.slack_channel || '#fulfillment-console-qa' }}
      SUITE_TITLE: Orders Tab — Core 8 left filters regression (PROD)
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '11'
          cache: maven

      - name: Compile tests
        run: mvn -B test-compile

      - name: Run Orders Core 8 left-filter regression (PROD)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          mvn -B test \
            "-DsuiteXmlFile=${SUITE}" \
            "-Dsystem.test.testenvironment=${TEST_ENV}" \
            "-Dsystem.test.sendreportautoemails=true" \
            "-Dsystem.test.sendreportemailaddress=${REPORT_EMAIL}" \
            "-Dsystem.test.leftfilteremailsuitetitle=${SUITE_TITLE}" \
            "-Dsystem.test.sendchatreport=true" \
            "-Dsystem.test.slackwebhookurl=${SLACK_WEBHOOK_URL}" \
            "-Dsystem.test.slackchannel=${SLACK_CHANNEL}"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-lf-orders-core8-prod
          path: |
            allure-results/
            target/surefire-reports/
            test-output/screenshots/
          if-no-files-found: warn
